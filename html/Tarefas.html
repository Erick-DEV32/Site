<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="../Style/tarefa.css" />
  </head>

  <body>
    <div class="container">
      <div class="cabecalho">
        <h1>Gerenciador de Tarefas</h1>

        <div class="acoes-cabecalho">
          <button id="botaoTema" class="botao-tema" type="button" onclick="alternarTema()">
            Tema escuro
          </button>

          <button class="botao-sair" onclick="sair()">Sair</button>
        </div>
      </div>

      <!-- NOVA TAREFA -->

      <div class="nova-tarefa">
        <input
          type="text"
          id="inputTarefa"
          placeholder="Digite uma nova tarefa"
        />

        <button onclick="adicionarTarefa()">Adicionar</button>
      </div>

      <div id="resumoTarefas" class="resumo-tarefas" aria-live="polite"></div>

      <!-- LISTA DE TAREFAS -->

      <div id="listaTarefas"></div>
    </div>

    <script src="../javascript/tema.js"></script>
    <script src="../javascript/tarefas.js"></script>
  </body>
</html>
