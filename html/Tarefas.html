<!DOCTYPE html>

<!-- Define o documento como HTML5 e informa o idioma da página. -->
<html lang="pt-BR">
  <head>
    <!-- Permite a exibição correta de caracteres especiais. -->
    <meta charset="UTF-8">

    <!-- Ajusta a escala da página para dispositivos móveis. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define o nome da página na aba do navegador. -->
    <title>Gerenciador de Tarefas</title>

    <!-- Carrega os estilos da tela de tarefas. -->
    <link rel="stylesheet" href="../Style/tarefa.css">
  </head>

  <body>
    <!-- Limita e organiza o conteúdo principal da aplicação. -->
    <div class="container">
      <!-- Reúne o título e as ações de navegação. -->
      <div class="cabecalho">
        <!-- Identifica a área atual do sistema. -->
        <h1>Gerenciador de Tarefas</h1>

        <!-- Agrupa os controles de tema, administração e saída. -->
        <div class="acoes-cabecalho">
          <!-- Alterna entre tema claro e escuro. -->
          <button id="botaoTema" class="botao-tema" type="button" onclick="alternarTema()">
            Tema escuro
          </button>

          <!-- Leva o administrador para a área de usuários. -->
          <a id="menuAdministracao" class="botao-administracao" href="Usuarios.html">
            Administração
          </a>

          <!-- Encerra a sessão atual. -->
          <button type="button" class="botao-sair" onclick="sair()">Sair</button>
        </div>
      </div>

      <!-- NOVA TAREFA -->

      <!-- Reúne o campo e o botão de criação de tarefas. -->
      <div class="nova-tarefa">
        <!-- Recebe o texto da nova tarefa. -->
        <input
          type="text"
          id="inputTarefa"
          placeholder="Digite uma nova tarefa"
          aria-label="Texto da nova tarefa">

        <!-- Define a prioridade da tarefa. -->
        <select id="prioridadeTarefa" aria-label="Prioridade da tarefa">
          <option value="baixa">Prioridade baixa</option>
          <option value="media" selected>Prioridade média</option>
          <option value="alta">Prioridade alta</option>
        </select>

        <!-- Define a categoria da tarefa. -->
        <select id="categoriaTarefa" aria-label="Categoria da tarefa">
          <option value="geral">Geral</option>
          <option value="trabalho">Trabalho</option>
          <option value="estudos">Estudos</option>
          <option value="pessoal">Pessoal</option>
        </select>

        <!-- Define o prazo opcional da tarefa. -->
        <input
          type="date"
          id="prazoTarefa"
          aria-label="Prazo da tarefa">

        <!-- Solicita a criação da tarefa. -->
        <button type="button" onclick="adicionarTarefa()">Adicionar</button>
      </div>

      <!-- Exibe as quantidades e percentuais de tarefas. -->
      <div id="resumoTarefas" class="resumo-tarefas" aria-live="polite"></div>

      <!-- Agrupa o campo usado para filtrar tarefas. -->
      <div class="pesquisa-tarefas">
        <label for="pesquisaTarefas">Pesquisar tarefas</label>
        <input
          type="search"
          id="pesquisaTarefas"
          placeholder="Digite parte da tarefa">
      </div>

      <!-- Reúne filtros e ordenação da lista. -->
      <div class="filtros-tarefas" aria-label="Filtros de tarefas">
        <select id="filtroStatus" aria-label="Filtrar por status">
          <option value="todas">Todas as tarefas</option>
          <option value="pendentes">Somente pendentes</option>
          <option value="concluidas">Somente concluídas</option>
          <option value="atrasadas">Somente atrasadas</option>
        </select>

        <select id="filtroPrioridade" aria-label="Filtrar por prioridade">
          <option value="todas">Todas as prioridades</option>
          <option value="alta">Prioridade alta</option>
          <option value="media">Prioridade média</option>
          <option value="baixa">Prioridade baixa</option>
        </select>

        <select id="filtroCategoria" aria-label="Filtrar por categoria">
          <option value="todas">Todas as categorias</option>
          <option value="geral">Geral</option>
          <option value="trabalho">Trabalho</option>
          <option value="estudos">Estudos</option>
          <option value="pessoal">Pessoal</option>
        </select>

        <select id="ordenacaoTarefas" aria-label="Ordenar tarefas">
          <option value="criacao">Mais recentes</option>
          <option value="prazo">Prazo mais próximo</option>
          <option value="prioridade">Maior prioridade</option>
          <option value="nome">Nome</option>
        </select>
      </div>

      <!-- LISTA DE TAREFAS -->

      <!-- Recebe dinamicamente as tarefas criadas pelo JavaScript. -->
      <div id="listaTarefas"></div>
    </div>

    <!-- Modal reutilizado para edição e confirmação de exclusão. -->
    <div id="modalTarefa" class="modal" hidden>
      <div class="modal-conteudo" role="dialog" aria-modal="true" aria-labelledby="tituloModal">
        <h2 id="tituloModal">Editar tarefa</h2>
        <p id="mensagemModal"></p>

        <label id="rotuloModal" for="valorModal">Texto da tarefa</label>
        <input id="valorModal" type="text">

        <div class="acoes-modal">
          <button id="cancelarModal" type="button" class="botao-secundario-modal">Cancelar</button>
          <button id="confirmarModal" type="button" class="botao-confirmar-modal">Confirmar</button>
        </div>
      </div>
    </div>

    <!-- Carrega o comportamento do tema. -->
    <script src="../javascript/tema.js"></script>
    <!-- Carrega as regras de autenticação e sessão. -->
    <script src="../javascript/auth.js"></script>
    <!-- Carrega o gerenciamento das tarefas. -->
    <script src="../javascript/tarefas.js"></script>
  </body>
</html>
