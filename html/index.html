<!DOCTYPE html>

<!-- Define que o documento usa o padrão HTML5. -->
<html lang="pt-BR">

<head>
  <!-- Define a codificação para aceitar corretamente caracteres em português. -->
  <meta charset="UTF-8">

  <!-- Faz o layout se adaptar à largura de celulares e tablets. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Define o título exibido na aba do navegador. -->
  <title>Login - Gerenciador de Tarefas</title>

  <!-- Carrega os estilos específicos da tela de login. -->
  <link rel="stylesheet" href="../Style/style.css">
</head>

<body>
  <!-- Centraliza o conteúdo principal da página. -->
  <div class="container">
    <!-- Agrupa os elementos visuais do formulário de login. -->
    <div class="login-box">
      <!-- Exibe o título da tela. -->
      <h1>Login</h1>

      <!-- Permite alternar entre os temas claro e escuro. -->
      <button id="botaoTema" class="botao-tema" type="button" onclick="alternarTema()">
        Tema escuro
      </button>

      <!-- Orienta o usuário sobre a finalidade do formulário. -->
      <p>Entre com suas credenciais</p>

      <!-- Agrupa os campos e dispara a autenticação no envio. -->
      <form id="formLogin">
        <!-- Campo destinado ao nome do usuário. -->
        <div class="campo">
          <label for="usuario">Usuário</label>

          <input type="text" id="usuario" placeholder="Digite seu usuário" required>
        </div>

        <!-- Campo destinado à senha, com conteúdo oculto. -->
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Digite sua senha" required autocomplete="current-password">
        </div>

        <!-- Envia as credenciais para o código JavaScript validar. -->
        <button type="submit">Entrar</button>
      </form>

      <!-- Recebe mensagens de sucesso ou erro do login. -->
      <p id="mensagem"></p>
    </div>
  </div>

  <!-- Carrega a lógica de aplicação e troca de tema. -->
  <script src="../javascript/tema.js"></script>
  <!-- Carrega a lógica de autenticação do formulário. -->
  <script src="../javascript/auth.js"></script>
  <!-- Carrega scripts gerais da aplicação. -->
  <script src="../javascript/script.js"></script>
  <!--
    - Criar um script JS para chamar as funções dos outros scripts
    - Criar um script JS para chamar as funções dos outros scripts
    - Criar um script JS para chamar as funções dos outros scripts
  -->
</body>

</html>
